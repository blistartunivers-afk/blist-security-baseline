name: "Security Lint (Bandit)"
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r .
