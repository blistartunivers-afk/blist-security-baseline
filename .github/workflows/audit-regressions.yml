name: Audit regressions
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    name: Audit regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/test_check_sarif.py
      - run: make audit
      - run: python3 scripts/test_install_baseline.py
